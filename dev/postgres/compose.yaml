name: nexora-c3-postgres

services:
  postgres:
    image: docker.io/library/postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    pull_policy: never
    network_mode: none
    restart: "no"
    environment:
      POSTGRES_USER: nexora_c3
      POSTGRES_DB: nexora_c3
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,noexec,size=268435456
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "nexora_c3", "-d", "nexora_c3", "-t", "3"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 5s

secrets:
  postgres_password:
    file: ${NEXORA_C3_PASSWORD_FILE:?Set NEXORA_C3_PASSWORD_FILE to an external private password file}
