name: nexora
services:
  app:
    image: nexora-c71-app:local
    pull_policy: never
    restart: "no"
    network_mode: none
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NEXORA_LISTEN_ADDRESS: 127.0.0.1:8080
      NEXORA_SHUTDOWN_TIMEOUT: 10s
    stop_grace_period: 15s
  runtime-demo:
    profiles: ["demo"]
    image: nexora-c71-runtime-demo:local
    pull_policy: never
    restart: "no"
    network_mode: none
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
